[workspace]
resolver = "2"
members = [
    "kite-plugin-sdk",
    "calculator",
    "window-switcher",
    "devtools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kite-plugin-sdk = { path = "kite-plugin-sdk" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
