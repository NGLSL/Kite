[package]
name = "kite"
version = "0.1.0"
description = "Lightweight Windows launcher"
authors = ["Kite"]
edition = "2021"

[lib]
name = "kite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = { version = "2", default-features = false }
dirs = { version = "6", default-features = false }
lnk = { version = "0.5", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = { version = "0.22", default-features = false }
sha2 = { version = "0.10", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
