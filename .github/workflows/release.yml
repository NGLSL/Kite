name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Verify tag commit is on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          $tagCommit = (git rev-list -n 1 $env:GITHUB_REF).Trim()
          $mainCommit = (git rev-parse origin/main).Trim()
          git merge-base --is-ancestor $tagCommit $mainCommit
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:GITHUB_REF points to $tagCommit, which is not contained in origin/main ($mainCommit)."
          }
      - name: Verify tag commit CI succeeded
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagCommit = (git rev-list -n 1 $env:GITHUB_REF).Trim()
          $repo = $env:GITHUB_REPOSITORY
          $uri = "https://api.github.com/repos/$repo/actions/workflows/ci.yml/runs?head_sha=$tagCommit&status=success&per_page=1"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          try {
            $runs = Invoke-RestMethod -Headers $headers -Uri $uri
          } catch {
            throw "Failed to query CI runs for $tagCommit : $_"
          }
          if ($runs.total_count -lt 1) {
            throw "Tag commit $tagCommit has no successful CI run. Push main, wait for ci.yml to pass, then tag that commit."
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install NSIS
        run: choco install nsis -y
      - name: Run release tests
        run: cargo test
      - name: Build installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Nsis "C:\Program Files (x86)\NSIS\makensis.exe"
      - name: Assemble release report
        shell: pwsh
        run: ./scripts/generate-release-report.ps1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/kite-setup.exe
          body_path: release-body.md
