name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit ref preserves the annotated tag object during checkout.
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify annotated version tag, main ancestry and exact-commit CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -notmatch '^v') { throw 'Release must run on a version tag' }
          $type = git cat-file -t $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0 -or $type -ne 'tag') { throw 'Release requires an annotated tag' }
          $tagCommit = git rev-parse "$($env:GITHUB_REF)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve tag commit' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit -or $tagCommit -ne $env:GITHUB_SHA) { throw 'Tag, checkout and workflow event commits differ' }
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and Cargo package version differ' }
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch main' }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag commit $tagCommit is not contained in origin/main" }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tagCommit&event=push&branch=main&status=success&per_page=100"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $runs = Invoke-RestMethod -Headers $headers -Uri $uri
          $matched = @($runs.workflow_runs | Where-Object {
            $_.head_sha -eq $tagCommit -and $_.head_branch -eq 'main' -and $_.event -eq 'push' -and $_.conclusion -eq 'success'
          })
          if ($matched.Count -eq 0) { throw "No successful main push CI for exact commit $tagCommit. Wait for CI before tagging." }

  package:
    needs: gate
    uses: ./.github/workflows/package-windows.yml

  publish:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: kite-windows-validated
          path: artifacts
      - name: Assemble release report from installation evidence
        run: ./scripts/generate-release-report.ps1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/kite-setup.exe
            artifacts/kite-setup.exe.sha256
            artifacts/installer-validation.json
          body_path: release-body.md
