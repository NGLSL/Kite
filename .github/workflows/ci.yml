name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build official plugins
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-official-plugins.ps1
      - name: Rust tests
        run: cargo test
      - name: Release build
        run: cargo build --release