name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Kite
    steps:
      - uses: actions/checkout@v4
        with:
          path: Kite
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Kite -> target
            Kite/official-plugins -> target
      - name: Build official plugins
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-official-plugins.ps1
      - name: Rust tests
        run: cargo test
      - name: Release build
        run: cargo build --release
